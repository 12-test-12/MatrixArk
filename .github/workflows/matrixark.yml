name: MatrixArk

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      database:
        description: 数据库迁移与集成测试
        type: boolean
        default: false
      api:
        description: API 与 Web 构建、类型与测试检查
        type: boolean
        default: false
      package_docker:
        description: 最终打包 Docker 镜像
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    name: 选择本次任务
    runs-on: ubuntu-24.04
    outputs:
      database: ${{ steps.targets.outputs.database }}
      api: ${{ steps.targets.outputs.api }}
      package_image: ${{ steps.targets.outputs.package_image }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test infra/ci/select-targets.test.mjs
      - id: targets
        env:
          CHANGED_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHANGED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_DATABASE: ${{ inputs.database }}
          RUN_API: ${{ inputs.api }}
          PACKAGE_DOCKER: ${{ inputs.package_docker }}
        run: node infra/ci/select-targets.mjs

  database:
    name: PostgreSQL 16 迁移与集成测试
    needs: plan
    if: needs.plan.outputs.database == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: corepack enable && pnpm install --frozen-lockfile --filter @matrixark/api...
      - name: 安装原生 PostgreSQL 16
        run: |
          if [[ ! -x /usr/lib/postgresql/16/bin/initdb ]]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi
      - run: bash infra/ci/check-database.sh

  api:
    name: API 与 Web 构建和测试
    needs: plan
    if: needs.plan.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm db:generate && pnpm build && pnpm typecheck && pnpm test
      - run: node --test apps/api/test/publish-modes.test.mjs apps/api/test/bilibili-oauth.test.mjs apps/api/test/local-browser.test.mjs apps/api/test/bilibili-qr.test.mjs apps/api/test/platform-policies.test.mjs apps/api/test/worker-concurrency.test.mjs

  package:
    name: 最终 Docker 打包
    needs: plan
    if: needs.plan.outputs.package_image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 构建并导出镜像
        shell: bash
        run: |
          image="matrixark-api:${GITHUB_SHA::12}"
          docker build -f infra/api.Dockerfile -t "$image" .
          docker save "$image" | gzip -1 > matrixark-api.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: matrixark-api-${{ github.sha }}
          path: matrixark-api.tar.gz
          compression-level: 0
          if-no-files-found: error
